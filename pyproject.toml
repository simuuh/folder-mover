[project]
name = "folder-mover"
version = "1.5.0"
description = "Self-hosted web UI that sorts movie and series downloads into a NAS library"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
markers = ["rename: allow the same-filesystem rename fast path (tests copy by default)"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E221", "E241", "E272"]  # aligned assignments/dict values are used on purpose
