# Folder Mover — compose file
# Nothing to edit here: copy .env.example to .env and adjust that file.

services:
  folder-mover:
    image: ghcr.io/simuuh/folder-mover:${FM_VERSION:-latest}
    # build: .                      # or build the image locally
    container_name: folder-mover
    restart: unless-stopped
    env_file: .env                  # PUID/PGID, TZ, FOLDER_MOVER_* login settings
    ports:
      - "${FM_PORT:-8080}:8080"
    volumes:
      - ${FM_CONFIG_PATH:-./config}:/config
      - ${FM_DOWNLOADS_PATH:?set FM_DOWNLOADS_PATH in .env}:/downloads
      - ${FM_MOVIES_PATH:?set FM_MOVIES_PATH in .env}:/movies
      - ${FM_SERIES_PATH:?set FM_SERIES_PATH in .env}:/series
